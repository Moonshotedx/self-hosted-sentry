        limits: { memory: 512M }

  symbolicator:
    image: "$SYMBOLICATOR_IMAGE"
    environment:
      SYMBOLICATOR_STATSD_ADDR: ${STATSD_ADDR:-127.0.0.1:8125}
    command: run -c /etc/symbolicator/config.yml
    volumes:
      - "sentry-symbolicator:/data"
      - type: bind
        read_only: true
        source: /opt/sentry/self-hosted/symbolicator
