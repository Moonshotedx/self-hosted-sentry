  # BM2 — APP (Sentry web/workers/consumers + SeaweedFS, 48 GB)
  ##############################################

  seaweedfs:
    image: "chrislusf/seaweedfs:4.17_large_disk"
    entrypoint: "weed"
    command: >-
        server
        -dir=/data
        -filer=true
        -filer.port=8888
        -filer.port.grpc=18888
        -filer.defaultReplicaPlacement=000
        -master=true
        -master.port=9333
        -master.port.grpc=19333
        -metricsPort=9091
        -s3=true
        -s3.port=8333
        -s3.port.grpc=18333
        -volume=true
        -volume.dir.idx=/data/idx
        -volume.index=leveldbLarge
        -volume.max=0
        -volume.preStopSeconds=8
        -volume.readMode=redirect
        -volume.port=8080
        -volume.port.grpc=18080
        -ip.bind=0.0.0.0
        -webdav=false
    environment:
      <<: *force_no_proxy
      AWS_ACCESS_KEY_ID: sentry
      AWS_SECRET_ACCESS_KEY: sentry
    volumes:
      - "sentry-seaweedfs:/data"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "http_proxy='' wget -q -O- http://localhost:8080/healthz http://localhost:9333/cluster/healthz http://localhost:8333/healthz || exit 1"
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.sentry.role == app]
      restart_policy: { condition: any }
      resources:
        limits: { memory: 4G }

  seaweedfs-admin:
    image: "chrislusf/seaweedfs:4.17_large_disk"
    entrypoint: "weed"
    command: >-
      admin
      -port=23646
      -master=seaweedfs:9333
    environment:
      <<: *force_no_proxy
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.sentry.role == app]
      restart_policy: { condition: any }
      resources:
        limits: { memory: 512M }

  seaweedfs-worker:
    image: "chrislusf/seaweedfs:4.17_large_disk"
    entrypoint: "weed"
    command: >-
      worker
      -admin=seaweedfs-admin:23646
      -jobType=all
    environment:
      <<: *force_no_proxy
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.sentry.role == app]
      restart_policy: { condition: any }
